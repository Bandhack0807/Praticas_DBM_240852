
services:
  mysql:
    image: mysql:8.4
    container_name: mysql_db_240852
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "240852"
      MYSQL_DATABASE: db_test_7b
      TZ: America/Mexico_City
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=200
    ports:
      - "40852:3306"
    volumes:
      - mysql_data_7b:/var/lib/mysql
      - ./mysql.sql:/scripts/mysql.sql:ro
    networks:
      - mysql_network_7b
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  postgres:
    image: postgres:17
    container_name: postgres_db_240852
    restart: unless-stopped
    environment:
      POSTGRES_USER: "victor.hernandez"
      POSTGRES_PASSWORD: "240852"
      POSTGRES_DB: db_test_7b
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    ports:
      - "40853:5432"
    volumes:
      - postgres_data_7b:/var/lib/postgresql/data
      - ./postgresql.sql:/scripts/postgresql.sql:ro
    networks:
      - postgres_network_7b
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d db_test_7b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_web_240852
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "victor.hernandez@dataforge.dev"
      PGADMIN_DEFAULT_PASSWORD: "240852"
      TZ: America/Mexico_City
    ports:
      - "40854:80"
    volumes:
      - pgadmin_data_7b:/var/lib/pgadmin
    networks:
      - postgres_network_7b
    depends_on:
      postgres:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_web_240852
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
      TZ: America/Mexico_City
    ports:
      - "40855:80"
    networks:
      - mysql_network_7b
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data_7b:
  postgres_data_7b:
  pgadmin_data_7b:

networks:
  mysql_network_7b:
    driver: bridge
  postgres_network_7b:
    driver: bridge
